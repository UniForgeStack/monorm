[workspace]
resolver = "2"
members = ["languages/rust", "crates/contracts", "crates/extension-package", "crates/extension-build", "extensions/model-composition", "extensions/inherit", "extensions/query-defaults", "extensions/generic", "extensions/timestamps", "extensions/file-storage", "extensions/soft-delete", "extensions/locking", "extensions/proxy", "crates/core", "crates/engine", "crates/cli", "languages/python/native", "languages/js/native"]
# bench/rust-compare is a separate workspace.
exclude = ["bench", "tests/outside-extension"]

[profile.release]
lto = "fat"
codegen-units = 1

# TLS crypto is unusably slow unoptimized; keep dev builds (maturin develop) fast.
[profile.dev.package.ring]
opt-level = 3

[profile.dev.package.rustls]
opt-level = 3
