[workspace]
resolver = "2"
members = ["languages/rust", "crates/contracts", "crates/extension-build", "extensions/model-composition", "extensions/query-defaults", "extensions/generic", "extensions/timestamps", "extensions/soft-delete", "extensions/locking", "extensions/proxy", "extensions/proxy/runtime", "crates/core", "crates/engine", "crates/cli", "bindings/python", "bindings/node"]
# bench/rust-compare is a separate workspace.
exclude = ["bench", "extensions/file-storage/reference", "extensions/file-storage"]

[profile.release]
lto = "fat"
codegen-units = 1

# TLS crypto is unusably slow unoptimized; keep dev builds (maturin develop) fast.
[profile.dev.package.ring]
opt-level = 3

[profile.dev.package.rustls]
opt-level = 3
