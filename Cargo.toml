[workspace]
resolver = "2"
members = ["client", "contracts", "extension-build", "model-composition", "extensions/query-defaults", "extensions/generic", "extensions/timestamps", "extensions/soft-delete", "extensions/locking", "extensions/proxy", "extensions/proxy-runtime", "core", "engine", "cli", "bindings/python", "bindings/node"]
# bench/rust-compare is a separate workspace.
exclude = ["bench", "storage/reference", "storage/orm-extension"]

[profile.release]
lto = "fat"
codegen-units = 1

# TLS crypto is unusably slow unoptimized; keep dev builds (maturin develop) fast.
[profile.dev.package.ring]
opt-level = 3

[profile.dev.package.rustls]
opt-level = 3
