line-length = 120
# First-party roots, so import sorting keeps `monorm` and `monorm_file_storage` in the project group.
src = ["languages/python", "extensions/file-storage/integration/python/src"]
# Generated models: a test compares them with the generator output.
extend-exclude = ["examples/blog/models.py", "examples/blog/models.pyi"]

[lint]
# ORM None and boolean comparisons build query expressions.
extend-ignore = ["E711", "E712"]
