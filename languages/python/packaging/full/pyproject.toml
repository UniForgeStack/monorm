[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "orm-native-full"
version = "0.1.0"
requires-python = ">=3.11"
description = "Statically compiled ORM tooling engine with all first-party extensions"

# Build only through build-full-wheel.py: the emitted workspace supplies the host features.
[tool.maturin]
manifest-path = "../../native/Cargo.toml"
python-source = "."
module-name = "orm_native_full._native"
features = ["pyo3/extension-module"]
