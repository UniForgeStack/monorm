[package]
name = "monorm-python"
version = "0.1.1"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
monorm-core = { path = "../../../crates/core", default-features = false }
monorm-engine = { path = "../../../crates/engine", default-features = false }
monorm-cli = { path = "../../../crates/cli", optional = true, default-features = false }
pyo3 = { version = "0.29", features = ["chrono", "uuid"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
sea-query = { version = "1.0", default-features = false, features = ["with-chrono", "with-json", "with-uuid", "with-bigdecimal", "postgres-array", "thread-safe", "hashable-value"] }
serde_json = "1"
chrono = "0.4"
uuid = "1"
bigdecimal = "0.4"

[features]
default = ["postgres", "sqlite", "cli", "generate-python", "generate-typescript", "reference-loading"]
postgres = ["monorm-engine/postgres", "sea-query/backend-postgres", "monorm-cli?/postgres"]
sqlite = ["monorm-engine/sqlite", "sea-query/backend-sqlite", "monorm-cli?/sqlite"]
cli = ["dep:monorm-cli"]
generate-python = ["monorm-core/generate-python", "monorm-cli?/generate-python"]
generate-typescript = ["monorm-core/generate-typescript", "monorm-cli?/generate-typescript"]
reference-loading = ["monorm-core/reference-loading", "monorm-cli?/reference-loading"]

# Named release profiles must be built with --no-default-features.
profile-postgres = ["postgres"]
profile-sqlite = ["sqlite"]
profile-combined = ["postgres", "sqlite"]
profile-tooling = ["postgres", "sqlite", "cli", "generate-python", "generate-typescript", "reference-loading"]
