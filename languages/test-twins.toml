# Test cases that have no twin in the other language (checked by scripts/check-test-twins.py).
# `files` covers every case of one file; `ids` covers one case, `<file stem>::<normalized name>`.
# Each reason starts with a class: change, add-ts, add-py, move-to-engine, engine-covered, duplicate, one-language or keep.
# The class comes from the review of 2026-10-31: it says what must happen before the entry can go.
# Remove an entry when its test gets a twin. Give a new one-language test a real reason.

[python-only.files]
"languages/python/tests/test_benchmark_report.py" = "Python-only tool: bench/compare/report.py"
"languages/python/tests/test_benchmark_schema.py" = "Python-only tool: the Prisma benchmark setup"
"languages/python/tests/test_typing.py" = "Python type test: mypy and pyright run over check_models.py; TypeScript runs `npm run typecheck`"
"languages/python/tests/test_soft_delete_typing.py" = "Python type test: mypy and pyright; the twin is the tsc test in soft-delete-typing.test.ts"

