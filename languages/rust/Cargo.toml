[package]
name = "monorm-client"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
monorm-core = { path = "../../crates/core", default-features = false }
monorm-engine = { path = "../../crates/engine", default-features = false }
sea-query = { version = "1.0", default-features = false }
serde_json = "1"
serde = "1"
chrono = "0.4"
uuid = "1"
bigdecimal = "0.4"

[features]
default = ["postgres", "sqlite"]
postgres = ["monorm-engine/postgres"]
sqlite = ["monorm-engine/sqlite"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
monorm-core = { path = "../../crates/core", features = ["generate-rust"] }

[build-dependencies]
serde_json = "1"
monorm-core = { path = "../../crates/core", features = ["generate-rust"] }
