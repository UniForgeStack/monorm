[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "monorm"
version = "0.1.2"
authors = [{ name = "mh-alahdadi", email = "mhalah15@gmail.com" }]
description = "Async Python ORM with a Rust core"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# The first-party extensions and the auth app run inside the wheel, so their dependencies are the wheel's.
dependencies = ["argon2-cffi>=23.1", "opendal>=0.47,<0.48"]
keywords = ["monorm", "async", "asyncio", "rust", "postgresql", "sqlite", "prisma", "migrations"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Framework :: AsyncIO",
  "Topic :: Database",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/UniForgeStack/monorm"
Issues = "https://github.com/UniForgeStack/monorm/issues"
Changelog = "https://github.com/UniForgeStack/monorm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "pyright"]

[project.entry-points."monorm.extensions"]
"monorm.timestamps" = "monorm_timestamps"
"monorm.soft-delete" = "monorm_soft_delete"
"monorm.locking" = "monorm_locking"
"monorm.inherit" = "monorm_inherit"
"monorm.query-defaults" = "monorm_query_defaults"
"monorm.generic" = "monorm_generic"
"monorm.proxy" = "monorm_proxy"
"monorm.composition" = "monorm_composition"
"monorm.file-storage" = "monorm_file_storage"

[project.entry-points."monorm.apps"]
monorm-auth = "monorm_auth:schema.prisma"

# One platform wheel: the tooling engine as `monorm._native`, plus the packages that
# `languages/python/packaging/stage.py` writes (the libraries of the extensions are not in git).
[tool.maturin]
manifest-path = "languages/python/native/Cargo.toml"
python-source = "languages/python"
module-name = "monorm._native"
no-default-features = true
features = ["pyo3/extension-module", "profile-tooling"]
python-packages = ["monorm_auth", "monorm_timestamps", "monorm_soft_delete", "monorm_locking", "monorm_inherit", "monorm_query_defaults", "monorm_generic", "monorm_proxy", "monorm_composition", "monorm_file_storage"]
include = [{ path = "languages/python/monorm_*/**/*", format = "wheel" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["languages/python/tests", "scripts/tests"]
# The rename fixtures keep old names on purpose; a conftest there would shadow `from conftest import`.
addopts = "--ignore-glob=scripts/tests/rename/fixtures/*"
pythonpath = ["examples"]

[tool.mypy]
strict = true
mypy_path = "languages/python:examples"

[tool.pyright]
extraPaths = ["languages/python", "examples"]

[tool.ty.environment]
extra-paths = ["languages/python", "examples"]

# `python -m monorm ...` from the repo root works on the blog example.
[tool.monorm]
schema = "examples/blog/schema.prisma"
migrations = "examples/blog/migrations"
