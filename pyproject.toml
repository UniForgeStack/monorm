[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orm"
version = "0.1.0"
authors = [{ name = "mh-alahdadi", email = "mhalah15@gmail.com" }]
description = "Async Python ORM with a Rust core"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["orm", "async", "asyncio", "rust", "postgresql", "sqlite", "prisma", "migrations"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Framework :: AsyncIO",
  "Topic :: Database",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/UniForgeStack/monorm"
Issues = "https://github.com/UniForgeStack/monorm/issues"
Changelog = "https://github.com/UniForgeStack/monorm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres = ["orm-native-postgres==0.1.0"]
sqlite = ["orm-native-sqlite==0.1.0"]
combined = ["orm-native-combined==0.1.0"]
tooling = ["orm-native-tooling==0.1.0"]
full = [
  "orm-native-tooling==0.1.0",
  "orm-generic==0.1.0",
  "orm-inherit==0.1.0",
  "orm-locking==0.1.0",
  "orm-composition==0.1.0",
  "orm-proxy==0.1.0",
  "orm-query-defaults==0.1.0",
  "orm-soft-delete==0.1.0",
  "orm-timestamps==0.1.0",
]
otel = ["opentelemetry-api>=1.20"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "pyright"]

[tool.setuptools.packages.find]
where = ["languages/python"]

[tool.setuptools.package-data]
orm = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["languages/python/tests", "scripts/tests"]
# The rename fixtures keep old names on purpose; a conftest there would shadow `from conftest import`.
addopts = "--ignore-glob=scripts/tests/rename/fixtures/*"
pythonpath = ["examples"]

[tool.mypy]
strict = true
mypy_path = "languages/python:examples"

[tool.pyright]
extraPaths = ["languages/python", "examples"]

[tool.ty.environment]
extra-paths = ["languages/python", "examples"]

# `python -m orm ...` from the repo root works on the blog example.
[tool.orm]
schema = "examples/blog/schema.prisma"
migrations = "examples/blog/migrations"
