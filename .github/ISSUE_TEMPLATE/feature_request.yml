name: Feature request
description: Ask for a new feature or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or schema syntax you expect, in Python, TypeScript or both.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you do today, and what other tools do.
