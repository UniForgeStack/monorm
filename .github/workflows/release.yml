name: Release
# A `v*` tag publishes to PyPI and npm. A manual run publishes to TestPyPI and dry-runs npm.
# crates.io comes later, when the Rust API is ready.
# The registries match this file name in the trusted publisher, so every publish step stays in this file.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      target: ${{ steps.version.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m unittest scripts/tests/test_release_versions.py
      - id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(python3 scripts/release/versions.py tag "$GITHUB_REF_NAME")
            target=real
            flags=()
          else
            version=$(python3 scripts/release/versions.py show)
            target=test
            flags=(--allow-tbd)
          fi
          python3 scripts/release/versions.py check "$version" "${flags[@]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
  builds:
    needs: version
    uses: ./.github/workflows/package-builds.yml
  extensions:
    needs: version
    uses: ./.github/workflows/extension-packages.yml
    permissions:
      contents: read
      actions: read # the called workflow asks for it; a tag run never reads it
  collect:
    needs: [version, builds, extensions]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/pypi
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist/npm
      - name: Check the files against the package lists
        run: |
          version='${{ needs.version.outputs.version }}'
          python3 scripts/release/publish-lists.py check pypi dist/pypi "$version"
          python3 scripts/release/publish-lists.py check npm dist/npm "$version"
          uvx twine check --strict dist/pypi/*
          for wheel in dist/pypi/*.whl; do python3 languages/python/packaging/check-wheel.py "$wheel"; done
      - name: Record the sizes
        run: |
          for file in dist/pypi/* dist/npm/*; do echo "$(basename "$file"): $(wc -c < "$file") bytes"; done | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-pypi
          path: dist/pypi
      - uses: actions/upload-artifact@v4
        with:
          name: release-npm
          path: dist/npm
  publish-pypi:
    needs: [version, collect]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-pypi
          path: dist/pypi
      # PyPI has one trusted publisher: this workflow in the `release` environment. No token is used.
      - name: Upload to PyPI
        if: needs.version.outputs.target == 'real'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
          skip-existing: true
      - name: Upload to TestPyPI
        if: needs.version.outputs.target == 'test'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/pypi
          skip-existing: true
  publish-npm:
    needs: [version, collect]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; the install fails when no such version exists.
      - run: npm install -g 'npm@>=11.5.1'
      - uses: actions/download-artifact@v4
        with:
          name: release-npm
          path: dist/npm
      # Without the NPM_TOKEN secret, npm uses the trusted publisher of each package.
      # An empty secret keeps the placeholder token that setup-node wrote, so the OIDC path stays open.
      - run: |
          export NODE_AUTH_TOKEN="${NPM_TOKEN:-$NODE_AUTH_TOKEN}"
          node scripts/release/npm-publish.mjs dist/npm --mode ${{ needs.version.outputs.target == 'real' && 'real' || 'dry-run' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  release-notes:
    if: needs.version.outputs.target == 'real'
    needs: [version, publish-pypi, publish-npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ needs.version.outputs.version }}'
          awk -v v="## [$version]" 'index($0, v) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > notes.md
          flags=(--verify-tag)
          if [ -s notes.md ]; then flags+=(--notes-file notes.md); else flags+=(--generate-notes); fi
          case "$version" in 0.*|*-*) flags+=(--prerelease);; esac
          gh release create "v$version" "${flags[@]}"
