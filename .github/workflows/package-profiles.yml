name: Native profile release checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['**/Cargo.toml', 'Cargo.lock', 'crates/**', 'languages/**', 'extensions/**', 'pyproject.toml', '.github/workflows/package-profiles.yml']
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        profile: [postgres, sqlite, combined, tooling]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-24.04' && 'postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orm_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ORM_TEST_DATABASE_URL: ${{ matrix.os == 'ubuntu-24.04' && 'postgres://postgres:postgres@localhost/orm_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install maturin setuptools wheel
      - run: python languages/python/packaging/check-dependencies.py
      - run: python -m pip wheel --no-deps --no-build-isolation -w target/wheels .
      - run: maturin build --release --out ../../../../target/wheels
        working-directory: languages/python/packaging/${{ matrix.profile }}
      - run: python languages/python/packaging/check-wheel.py target/wheels ${{ matrix.profile }}
      - name: Record the native wheel size
        shell: bash
        run: |
          for wheel in target/wheels/orm_native_${{ matrix.profile }}-*.whl; do
            echo "${{ matrix.os }} py${{ matrix.python }} $(basename "$wheel"): $(wc -c < "$wheel") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - run: python -m pip install --no-index --find-links target/wheels "monorm[${{ matrix.profile }}]"
      - run: python languages/python/packaging/smoke-python.py
        env:
          MONORM_PROFILE: ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.profile }}
          path: target/wheels/*.whl
  full-extra:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install maturin setuptools wheel pytest
      - run: python languages/python/packaging/check-full-extra.py
      - run: python -m pytest -q languages/python/tests/packaging/test_check_full_extra.py
      - run: python -m pip wheel --no-deps --no-build-isolation -w target/wheels .
      - run: maturin build --release --out ../../../../target/wheels
        working-directory: languages/python/packaging/tooling
      - name: Build the extension packages for this host
        run: |
          npm install --prefix target/tools --no-audit --no-fund typescript@^5.9.0
          for dir in extensions/*/; do
            name=$(basename "$dir")
            [ "$name" = file-storage ] && continue
            cargo run -q -p monorm-extension-package -- package "$dir" --out "target/wheels/$name" --tsc target/tools/node_modules/.bin/tsc
          done
      - name: Install monorm[full] from local wheels
        run: |
          python -m venv target/full-env
          target/full-env/bin/python -m pip install --no-index $(for d in target/wheels target/wheels/*/; do echo --find-links $d; done) "monorm[full]"
      - run: target/full-env/bin/python languages/python/packaging/smoke-full-extra.py
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
        profile: [postgres, sqlite, combined, tooling]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-24.04' && 'postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orm_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ORM_TEST_DATABASE_URL: ${{ matrix.os == 'ubuntu-24.04' && 'postgres://postgres:postgres@localhost/orm_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: languages/js
      - run: npx tsc -p tsconfig.json
        working-directory: languages/js
      - run: node languages/js/packaging/build-node-profile.mjs ${{ matrix.profile }} --release
      - run: node languages/js/packaging/check-node-install.mjs ${{ matrix.profile }}
      - name: Record the native package size
        shell: bash
        run: |
          for pack in target/npm-packs/orm-native-${{ matrix.profile }}-*.tgz; do
            echo "${{ matrix.os }} $(basename "$pack"): $(wc -c < "$pack") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.os }}-${{ matrix.profile }}
          path: target/npm-packs/*.tgz
