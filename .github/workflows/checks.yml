name: Checks
# One job per check group. `affected` picks the groups from the changed files (scripts/ci/affected.py).
# A schedule, a dispatch and a `v*` tag run every group. `checks-ok` is the one status to require.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
  actions: read # the push base is the head of the last green run
env:
  CARGO_INCREMENTAL: 0
jobs:
  affected:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.affected.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: affected
        uses: ./.github/actions/affected

  rust:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.groups), 'rust')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orm_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ORM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost/orm_test
      ORM_RUST_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost/orm_test_rs
      PYTHON: python3.14
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Rust test database
        run: docker exec ${{ job.services.postgres.id }} createdb -U postgres orm_test_rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@v6
      # The cargo typing tests run mypy and pyright from PATH.
      - run: uv venv --python "$PYTHON" .venv && uv pip install --python .venv/bin/python mypy pyright
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # The init tests assert the staged (gitignored) languages/python/monorm_*/ manifests.
      - run: python languages/python/packaging/stage.py
      # The extension-package tests compile TypeScript with languages/js/node_modules/.bin/tsc.
      - run: npm install
        working-directory: languages/js
      - run: cargo test -q
      - run: cargo clippy -q -p monorm-core -p monorm-engine -p monorm-python -p monorm-node -p monorm -p monorm-extension-package

  python:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.groups), 'python')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orm_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ORM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost/orm_test
      ORM_DOCS_DATABASE_URL: postgres://postgres:postgres@localhost/orm_docs
      PYTHON: python3.14
    steps:
      - uses: actions/checkout@v4
      - run: docker exec ${{ job.services.postgres.id }} createdb -U postgres orm_docs
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: uv venv --python "$PYTHON" .venv && uv pip install --python .venv/bin/python pytest 'pytest-asyncio>=0.24' pydantic mypy pyright maturin
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python languages/python/packaging/stage.py
      - run: maturin develop
      # The extension-package tests compile TypeScript with languages/js/node_modules/.bin/tsc.
      - run: npm install
        working-directory: languages/js
      - run: python -m pytest -q
      - run: mypy --strict languages/python/monorm && pyright languages/python/monorm
      - run: python -m pytest -q apps/auth/python/tests
      - run: python extensions/inherit/tests/public/python.py
      - run: python extensions/query-defaults/tests/public/python.py
      # The admin UI in a real browser; the browser download stays out of the default npm install.
      - run: npm ci && npx playwright install --with-deps chromium && npm test
        working-directory: crates/admin/ui/e2e
        timeout-minutes: 15
      # The committed crates/admin/ui/dist must equal a fresh build (checked byte for byte on Node 24).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build && npm run size && test -z "$(git status --porcelain -- dist)"
        working-directory: crates/admin/ui
        timeout-minutes: 10

  node:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.groups), 'node') || contains(fromJSON(needs.affected.outputs.groups), 'create-monorm')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orm_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ORM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost/orm_test
      ORM_DOCS_DATABASE_URL: postgres://postgres:postgres@localhost/orm_docs
      PYTHON: python3.14
    steps:
      - uses: actions/checkout@v4
      - run: docker exec ${{ job.services.postgres.id }} createdb -U postgres orm_docs
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `assemble` does not build languages/js/dist, which the create-monorm tests need; `npm test` builds it only for the node group.
      - run: npm install && npm run assemble && npm run build
        working-directory: languages/js
      - if: contains(fromJSON(needs.affected.outputs.groups), 'node')
        run: npm test && npm run test:bun && npm run typecheck
        working-directory: languages/js
      - if: contains(fromJSON(needs.affected.outputs.groups), 'create-monorm')
        run: npm test
        working-directory: languages/js/create-monorm
      - if: contains(fromJSON(needs.affected.outputs.groups), 'node')
        run: |
          node ../../extensions/inherit/tests/public/node.mjs
          node ../../extensions/query-defaults/tests/public/node.mjs
        working-directory: languages/js

  release-scripts:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.groups), 'release-scripts')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts/tests/test_check_glibc.py scripts/tests/test_release_versions.py
      - run: python3 scripts/release/versions.py check --allow-tbd

  docs:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.groups), 'docs')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/check_links.py

  test-twins:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.groups), 'test-twins')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-test-twins.py

  pgbouncer:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.groups), 'pgbouncer')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orm_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ORM_RUST_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost/orm_test_rs
      MONORM_PGBOUNCER_URL: postgres://postgres@127.0.0.1:6432/orm_test_rs
    steps:
      - uses: actions/checkout@v4
      - run: docker exec ${{ job.services.postgres.id }} createdb -U postgres orm_test_rs
      # PgBouncer in transaction mode (scripts/ci/pgbouncer/pgbouncer.ini) in front of the service; the image tag below sets the version.
      - name: Start PgBouncer
        run: |
          docker run -d --name pgbouncer --network host \
            -v "$PWD/scripts/ci/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro" \
            -v "$PWD/scripts/ci/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro" \
            --entrypoint /usr/bin/pgbouncer edoburu/pgbouncer:v1.26.1-p0 /etc/pgbouncer/pgbouncer.ini
          for _ in $(seq 20); do
            pg_isready -h 127.0.0.1 -p 6432 && exit 0
            sleep 1
          done
          docker logs pgbouncer
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The tests behind_pooler_* skip without MONORM_PGBOUNCER_URL.
      - run: cargo test -q -p monorm-engine --lib behind_pooler -- --test-threads=1
      - name: The two pooler tests exist
        run: |
          test "$(cargo test -q -p monorm-engine --lib behind_pooler -- --list | grep -c ': test')" = 2

  checks-ok:
    needs: [affected, rust, python, node, release-scripts, docs, test-twins, pgbouncer]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
