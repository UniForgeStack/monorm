name: Extension packages
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '47 3 * * *'
permissions:
  contents: read
  actions: read # the push base is the head of the last green run
jobs:
  # Runs only when the `packages` group is selected (scripts/ci/affected.py); a schedule, a dispatch and a `v*` tag (the release workflow calls this one) select every group.
  affected:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.affected.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: affected
        uses: ./.github/actions/affected
        with:
          workflow: extension-packages.yml
  installed-packages:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.groups), 'packages')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orm_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ORM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost/orm_test
      PYTHON: python3.14
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: uv venv --python "$PYTHON" .venv && uv pip install --python .venv/bin/python maturin
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: scripts/check-extension-packages.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-package-consumers
          path: |
            target/assembled-seam-*
            !target/assembled-seam-*/**/node_modules
            !target/assembled-seam-*/**/lib
  release-guards:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.groups), 'packages')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: monorm packages for crates.io
        run: cargo package -p monorm
      - name: Host crates name no extension
        run: |
          python3 -m unittest scripts/tests/test_check_extension_names.py
          python3 scripts/check-extension-names.py
