name: Names
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: No old project name
        run: python3 scripts/rename/rename.py --check
      - name: Publish metadata
        run: python3 -m unittest scripts/tests/test_package_metadata.py
