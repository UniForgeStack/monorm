# An extension built outside the ORM workspace: it depends on monorm-contracts only, as a package of another team would.
[package]
name = "outside-extension"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
monorm-contracts = { path = "../../crates/contracts" }
serde_json = "1"

[features]
# These two report an ABI that this engine rejects.
abi-major = []
abi-newer = []
# A library of ABI 0.1: the passes and no `init`, `drop_state` or hook table. Build one feature at a time.
pass-only = []
