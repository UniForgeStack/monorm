id = "acme.outside"
version = "0.1.0"
schema_contract = "2.2"
abi = "0.2"
library = "outside_extension"
language_contract = 1
languages = ["python", "typescript"]
databases = ["postgres", "sqlite"]

# `@@outside.tag("label")` adds the text field `tag` with the argument as its default.
[[attributes]]
name = "outside.tag"
target = "model"

[[attributes.positional]]
kind = "string"
required = true

[[passes]]
id = "acme.outside.tag"
phase = "declaration"
effects = ["models.outside", "behavior.storage"]

# `price Money @outside.money` owns the type `Money`: the pass replaces the field with `price_amount` and `price_currency`.
# A schema that uses it needs model identities.
[[attributes]]
name = "outside.money"
target = "field"
field_type = "Money"
identities = true

# `memo String @outside.note("text")` is no model member: the pass writes the text into the `extension_data` of the package.
[[attributes]]
name = "outside.note"
target = "field"
member = false

[[attributes.positional]]
kind = "string"
required = true

[[passes]]
id = "acme.outside.fields"
phase = "declaration"
effects = ["fields.outside", "behavior.extension_data"]

# `@@outside.base(parent: "A", parentRef: "a", childRef: "b")` stores the fields of `A` in the table of `A`, the others in its own table, under one shared key.
[[attributes]]
name = "outside.base"
target = "model"

[attributes.arguments.parent]
kind = "string"
required = true

[attributes.arguments.parentRef]
kind = "string"
required = true

[attributes.arguments.childRef]
kind = "string"
required = true

[[passes]]
id = "acme.outside.base"
phase = "logical"
effects = ["outside.base.storage-ownership"]

# Hooks of the library. `outside.prefix` reads the `{"prefix": ...}` of its `extension_data` entry.
[[exports]]
id = "outside.prefix"
point = 1
input = "string"
output = "string"

[[exports]]
id = "outside.audit"
point = 2
input = "string"

[[exports]]
id = "outside.context"
point = 6
output = "json"

[python]
source = "python"
query_set = "OutsideQuerySet"
instance = "OutsideInstance"

[typescript]
source = "typescript"
query_set = "OutsideQuerySet"
instance = "OutsideInstance"
