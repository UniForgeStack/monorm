id = "acme.outside"
version = "0.1.0"
schema_contract = "3.4"
abi = "0.2"
library = "outside_extension"
language_contract = 1
languages = ["python", "typescript"]
databases = ["postgres", "sqlite"]

# `@@outside.tag("label")` adds the text field `tag` with the argument as its default.
[[attributes]]
name = "outside.tag"
target = "model"

[[attributes.positional]]
kind = "string"
required = true

[[passes]]
id = "acme.outside.tag"
phase = "declaration"
effects = ["models.outside", "behavior.storage"]

# `price Money @outside.money` owns the type `Money`: the pass replaces the field with `price_amount` and `price_currency`.
# A schema that uses it needs model identities.
[[attributes]]
name = "outside.money"
target = "field"
field_type = "Money"
identities = true

# `memo String @outside.note("text")` is no model member: the pass writes the text into the `extension_data` of the package.
[[attributes]]
name = "outside.note"
target = "field"
member = false

[[attributes.positional]]
kind = "string"
required = true

[[passes]]
id = "acme.outside.fields"
phase = "declaration"
effects = ["fields.outside", "behavior.extension_data"]

# `@@outside.view(Source, "open")` makes the model a view of `Source` that sees only the rows with `status = 'open'`.
# The pass writes a model view with a row filter, and a result check with its own code for each field that the view declares non-null and `Source` stores as nullable.
[[attributes]]
name = "outside.view"
target = "model"
view_source = true

[[attributes.positional]]
kind = "value"
required = true

[[attributes.positional]]
kind = "string"
required = true

[[passes]]
id = "acme.outside.view"
phase = "logical"
effects = ["models.view", "behavior.model_views", "behavior.result_checks"]

# `@@outside.guard` binds the hooks of the library to the fields `text`, `start`, `end`, `shop_id` and `updated_by` of the model.
[[attributes]]
name = "outside.guard"
target = "model"

[[passes]]
id = "acme.outside.guard"
phase = "declaration"
after = ["acme.outside.tag"]
effects = ["behavior.hooks.outside", "behavior.write_assignments.outside", "behavior.outside_read_defaults", "behavior.result_fields.outside"]

# `note Json? @outside.wrapped("w:")` shows the stored JSON as a `Wrapped` and adds the method `note_unwrap`.
# The pass pushes a field adapter whose options are the prefix; the `[[python.field_adapters]]` and `[[typescript.field_adapters]]` entries below name the runtime.
[[attributes]]
name = "outside.wrapped"
target = "field"

[[attributes.positional]]
kind = "string"
required = true

[[passes]]
id = "acme.outside.wrapped"
phase = "declaration"
effects = ["behavior.field_adapters"]

# Hooks of the library. `outside.prefix` reads the `{"prefix": ...}` of its `extension_data` entry.
[[exports]]
id = "outside.prefix"
point = 1
input = "string"
output = "string"

[[exports]]
id = "outside.audit"
point = 2
input = "string"

[[exports]]
id = "acme.outside.trim"
point = 1
input = "string"
output = "string"

[[exports]]
id = "acme.outside.nonempty"
point = 2
input = "string"

[[exports]]
id = "acme.outside.ordered"
point = 3

[[exports]]
id = "acme.outside.actor"
point = 4
output = "string"

[[exports]]
id = "acme.outside.initials"
point = 5
output = "string"

[[exports]]
id = "acme.outside.seal"
point = 1
input = "string"
output = "string"

[[exports]]
id = "acme.outside.unseal"
point = 5
output = "string"

[[exports]]
id = "acme.outside.label"
point = 6
output = "json"

[[exports]]
id = "acme.outside.editor"
point = 6
output = "json"

[[exports]]
id = "acme.outside.region"
point = 7
output = "json"

[[exports]]
id = "acme.outside.owner"
point = 7
output = "json"

[[exports]]
id = "outside.context"
point = 6
output = "json"

[python]
source = "python"
query_set = "OutsideQuerySet"
instance = "OutsideInstance"

[[python.field_adapters]]
adapter = "acme.outside.wrapped.v1"
module = "acme_outside"
install = "install"
imports = ["from acme_outside import Wrapped"]
value = "Wrapped"
members = ["def {field}_unwrap(self) -> object: ..."]
methods = ["{field}_unwrap"]
module_functions = [{ name = "configure_outside", method = "configure", stub = "(prefix: str) -> None" }]

[typescript]
source = "typescript"
query_set = "OutsideQuerySet"
instance = "OutsideInstance"

[[typescript.field_adapters]]
adapter = "acme.outside.wrapped.v1"
module = "@acme/outside"
install = "install"
imports = ['import type { Wrapped } from "@acme/outside";']
value = "Wrapped"
members = ["{field}Unwrap(): unknown;"]
methods = ["{field}Unwrap"]
module_functions = [{ name = "configureOutside", method = "configure", stub = "(prefix: string) => void" }]
