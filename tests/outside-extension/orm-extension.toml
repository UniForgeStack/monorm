id = "acme.outside"
version = "0.1.0"
schema_contract = "2.1"
abi = "0.2"
library = "outside_extension"
language_contract = 1
languages = ["python", "typescript"]
databases = ["postgres", "sqlite"]

# `@@outside.tag("label")` adds the text field `tag` with the argument as its default.
[[attributes]]
name = "outside.tag"
target = "model"

[[attributes.positional]]
kind = "string"
required = true

[[passes]]
id = "acme.outside.tag"
phase = "declaration"
effects = ["models.outside", "behavior.storage"]

# `@@outside.guard` binds the hooks of the library to the fields `text`, `start`, `end`, `shop_id` and `updated_by` of the model.
[[attributes]]
name = "outside.guard"
target = "model"

[[passes]]
id = "acme.outside.guard"
phase = "declaration"
after = ["acme.outside.tag"]
effects = ["behavior.hooks.outside", "behavior.write_assignments.outside", "behavior.read_defaults.outside"]

# Hooks of the library. `outside.prefix` reads the `{"prefix": ...}` of its `extension_data` entry.
[[exports]]
id = "outside.prefix"
point = 1
input = "string"
output = "string"

[[exports]]
id = "outside.audit"
point = 2
input = "string"

[[exports]]
id = "acme.outside.trim"
point = 1
input = "string"
output = "string"

[[exports]]
id = "acme.outside.nonempty"
point = 2
input = "string"

[[exports]]
id = "acme.outside.ordered"
point = 3

[[exports]]
id = "acme.outside.actor"
point = 4
output = "string"

[[exports]]
id = "outside.context"
point = 6
output = "json"

[python]
source = "python"
query_set = "OutsideQuerySet"
instance = "OutsideInstance"

[typescript]
source = "typescript"
query_set = "OutsideQuerySet"
instance = "OutsideInstance"
