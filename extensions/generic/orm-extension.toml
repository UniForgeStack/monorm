id = "orm.generic"
version = "0.1.0"
abi = "0.2"
library = "orm_generic"
schema_contract = "5.0"
language_contract = 1
languages = ["python", "typescript"]
databases = ["postgres", "sqlite"]
capabilities = ["schema-transformations", "physical-schema"]

[[attributes]]
name = "generic.relation"
target = "model"
identities = true
positional = [{ kind = "string", required = true }]
[attributes.arguments]
type = { kind = "string", required = true }
key = { kind = "string", required = true }
targets = { kind = "list", required = true }

# The field form: `target Generic? @generic.relation(targets: [...])` creates the pair fields.
[[attributes]]
name = "generic.relation"
target = "field"
field_type = "Generic"
identities = true
[attributes.arguments]
targets = { kind = "list", required = true }
type = { kind = "string" }
key = { kind = "string" }
index = { kind = "boolean" }

[[attributes]]
name = "generic.reverse"
target = "field"
member = false
identities = true
[attributes.arguments]
relation = { kind = "string" }

[[passes]]
id = "orm.generic.prepare"
phase = "behavior"
effects = ["behavior.extension_data.generic", "storage.generic_checks"]
