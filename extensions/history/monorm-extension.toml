id = "monorm.history"
version = "0.1.3"
abi = "0.2"
library = "monorm_history"
schema_contract = "5.10"
language_contract = 1
languages = ["python", "typescript"]
databases = ["postgres", "sqlite"]
capabilities = ["schema-transformations", "physical-schema"]

# Builds the event model of each tracker and the version columns of each version model. Runs in the `storage` phase, after the `logical` passes that lower proxies and composed models, so it sees their roots.
[[passes]]
id = "monorm.history.models"
phase = "storage"
effects = ["models.history_events", "models.history_versions", "storage.history_events", "storage.history_versions"]
additive = ["behavior.extension_records", "behavior.published_scope_keys", "behavior.write_rules"]

# Adds the row triggers of each tracker to the table that it tracks. Runs after the `behavior` passes, so the triggers of the other extensions exist.
[[passes]]
id = "monorm.history.triggers"
phase = "late_behavior"
effects = ["models.history_triggers", "storage.history_triggers", "behavior.added_triggers"]

# `@@history.track(model: "EmailEvent", events: [update], row: old, label: "email_changed", when: "NEW.email <> OLD.email", fields: [email], exclude: [password], scope: [user])`; repeatable.
[[attributes]]
name = "history.track"
target = "model"
[attributes.arguments.model]
kind = "string"
[attributes.arguments.label]
kind = "string"
[attributes.arguments.when]
kind = "string"
[attributes.arguments.events]
kind = "value"
[attributes.arguments.row]
kind = "value"
[attributes.arguments.fields]
kind = "value"
[attributes.arguments.exclude]
kind = "value"
[attributes.arguments.scope]
kind = "value"

# `@@history.versions(of: bundle_id, scope: [user])`: the version columns of an aggregate model.
[[attributes]]
name = "history.versions"
target = "model"
[attributes.arguments.of]
kind = "value"
[attributes.arguments.scope]
kind = "value"

# What `pull` writes back for each attribute, and the objects it leaves out of the schema because the attribute makes them. The first form of `history.track` is the default event table; the second is the table of `model:`.
[[object_claims]]
attribute = "history.track"
triggers = ["h_events_ins", "h_events_upd", "h_events_del"]
tables = ["{table}_events"]

[[object_claims]]
attribute = "history.track"
arguments = ['model: "{name:pascal}"']
triggers = ["h_{name}_ins", "h_{name}_upd", "h_{name}_del"]
tables = ["{name}"]

[[object_claims]]
attribute = "history.versions"
arguments = ["of: {of:field}"]
indexes = ["{table}_{of}_version_key"]
columns = ["version_number", "snapshot", "content_hash", "effective_at", "change_type", "restored_from", "xact_id"]
checks = ["{table}_change_type_check"]

[python]
source = "python/monorm_history"
query_set = "HistoryQuerySet"
instance = "HistoryInstance"

[typescript]
source = "typescript/src"
query_set = "historyQuerySet"
instance = "HistoryInstance"
