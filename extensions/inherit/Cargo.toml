[package]
name = "monorm-inherit"
version = "0.1.0"
edition = "2021"
publish = false
description = "Abstract models and model overrides for ORM schemas"

[dependencies]
monorm = { path = "../../crates/contracts" }
serde = "1"
serde_json = "1"

[dev-dependencies]
monorm-core = { path = "../../crates/core" }
rusqlite = { version = "0.37", features = ["bundled"] }
monorm-engine = { path = "../../crates/engine" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[lib]
crate-type = ["cdylib", "rlib"]
