[package]
name = "monorm-proxy"
version = "0.1.0"
edition = "2021"
publish = false
description = "Same-table proxy models for ORM: views over one source table"

[dependencies]
monorm = { path = "../../crates/contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
monorm-core = { path = "../../crates/core" }

[lib]
crate-type = ["cdylib", "rlib"]
