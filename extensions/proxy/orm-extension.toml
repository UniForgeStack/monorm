id = "orm.proxy"
version = "0.1.0"
abi = "0.2"
library = "orm_proxy"
schema_contract = "5.0"
language_contract = 1
languages = ["python", "typescript"]
databases = ["postgres", "sqlite"]
capabilities = ["schema-transformations", "physical-schema"]

[[passes]]
id = "orm.proxy.lower"
phase = "logical"
effects = ["behavior.extension_data.proxy", "behavior.model_views", "behavior.result_checks", "storage.proxy", "models.proxy"]

# `@@proxy.of(User)`: the source model is a bare name; the pass checks it is a string.
[[attributes]]
name = "proxy.of"
target = "model"
view_source = true
positional = [{ kind = "value", required = true }]

[[attributes]]
name = "proxy.fields"
target = "model"
[attributes.arguments]
include = { kind = "list" }
exclude = { kind = "list" }

[[attributes]]
name = "partition.values"
target = "model"
positional = [{ kind = "value", required = true }]
