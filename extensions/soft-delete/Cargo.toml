[package]
name = "orm-soft-delete"
version = "0.1.0"
edition = "2021"
publish = false
description = "Selected soft-delete compiler for ORM: delete triggers or ORM-only soft deletes"

[dependencies]
orm-contracts = { path = "../../crates/contracts" }
serde_json = "1"

[dev-dependencies]
orm-core = { path = "../../crates/core" }
rusqlite = { version = "0.37", features = ["bundled"] }

[package.metadata.orm-extension]
id = "orm.soft-delete"
version = "0.1.0"
host_contract = 1
schema_contract = 2
language_contract = 1
languages = ["python", "typescript"]
databases = ["postgres", "sqlite"]
capabilities = ["schema-transformations", "physical-schema"]

[[package.metadata.orm-extension.passes]]
id = "orm.soft-delete.prepare"
phase = "behavior"
rust = "crate::prepare"
after = ["orm.locking.prepare", "orm.timestamps.prepare"]
effects = ["behavior.read_defaults", "behavior.delete_rewrites", "storage.soft_delete_triggers"]

# `deleted_at DateTime? @soft_delete.deleted_at(mode: "application")`.
[[package.metadata.orm-extension.attributes]]
name = "soft_delete.deleted_at"
target = "field"
[package.metadata.orm-extension.attributes.arguments.mode]
kind = "string"

[package.metadata.orm-extension.python]
source = "python/orm_soft_delete"
query_set = "SoftDeleteQuerySet"
instance = "SoftDeleteInstance"
bound_query_set = "SoftDeleteBoundQuerySet"

[package.metadata.orm-extension.typescript]
source = "typescript/src"
query_set = "softDeleteQuerySet"
bound_query_set = "softDeleteBoundQuerySet"
instance = "SoftDeleteInstance"
