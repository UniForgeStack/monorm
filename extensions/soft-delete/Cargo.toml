[package]
name = "orm-soft-delete"
version = "0.1.0"
edition = "2021"
publish = false
description = "Selected soft-delete compiler for ORM: delete triggers or ORM-only soft deletes"

[dependencies]
orm-contracts = { path = "../../crates/contracts" }
serde_json = "1"

[dev-dependencies]
orm-core = { path = "../../crates/core" }
rusqlite = { version = "0.37", features = ["bundled"] }

[lib]
crate-type = ["cdylib", "rlib"]
