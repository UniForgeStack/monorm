id = "monorm.soft-delete"
version = "0.1.4"
abi = "0.2"
library = "monorm_soft_delete"
schema_contract = "5.4"
language_contract = 1
languages = ["python", "typescript"]
databases = ["postgres", "sqlite"]
capabilities = ["schema-transformations", "physical-schema"]

# Adds the field before the logical passes, so a proxy of the model copies it.
[[passes]]
id = "monorm.soft-delete.fields"
phase = "declaration"
effects = ["models.soft_delete", "storage.soft_delete"]

# Runs after the `behavior` passes of the other extensions, so their write assignments and read defaults exist.
[[passes]]
id = "monorm.soft-delete.prepare"
phase = "late_behavior"
effects = ["behavior.delete_rewrites", "storage.soft_delete_triggers"]
additive = ["behavior.extension_records", "behavior.read_defaults"]

# Runs after every behavior pass, so the read defaults of other extensions exist.
[[passes]]
id = "monorm.soft-delete.check"
phase = "validation"
after = ["monorm.soft-delete.prepare"]

# `@@soft_delete.deleted_at("deleted_at", map: "_deleted_at", mode: "application")`: adds the field.
[[attributes]]
name = "soft_delete.deleted_at"
target = "model"
[[attributes.positional]]
kind = "string"
[attributes.arguments.mode]
kind = "string"
[attributes.arguments.map]
kind = "string"
# The name of a database rule that the triggers replace: `pull` writes it, and the first migration after `baseline` drops it.
[attributes.arguments.rule]
kind = "string"

# The field form; the pass rejects it with the model attribute to write instead.
[[attributes]]
name = "soft_delete.deleted_at"
target = "field"
[attributes.arguments.mode]
kind = "string"

# The `ON DELETE DO INSTEAD` rules that `pull` reads as `@@soft_delete.deleted_at`, in the text PostgreSQL deparses.
# The first is the guitars rule, with its `rules.hard_deletion` bypass; the second is the plain rule.
[[rule_claims]]
attribute = "soft_delete.deleted_at"
rule_argument = "rule"
patterns = [
  "CREATE RULE {rule} AS ON DELETE TO public.{table} WHERE (COALESCE(current_setting('rules.hard_deletion'::text, true), ''::text) <> 'on'::text) DO INSTEAD UPDATE {table} SET {column} = now() WHERE (({table}.{key} = old.{key}) AND ({table}.{column} IS NULL));",
  "CREATE RULE {rule} AS ON DELETE TO public.{table} DO INSTEAD UPDATE {table} SET {column} = now() WHERE ({table}.{key} = old.{key});",
]

# `@soft_delete.keep_child_rows` on a relation field with `onDelete: Cascade`: a soft delete of the parent keeps the child rows.
# Without it, a cascade from a soft-delete model into a model without soft delete fails the schema load.
[[attributes]]
name = "soft_delete.keep_child_rows"
target = "field"

[python]
source = "python/monorm_soft_delete"
query_set = "SoftDeleteQuerySet"
instance = "SoftDeleteInstance"
bound_query_set = "SoftDeleteBoundQuerySet"

[typescript]
source = "typescript/src"
query_set = "softDeleteQuerySet"
bound_query_set = "softDeleteBoundQuerySet"
instance = "SoftDeleteInstance"
