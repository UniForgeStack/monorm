# Guard patterns and allowed old-name sites for `rename.py --check`.
# Every [[allow]] entry needs a reason and must match at least one hit, or --check fails.
# An entry allows only the text it matches: another old name on the same line still counts.
# Uppercase `ORM` and `ORMs` (the generic noun) never match a guard pattern, so prose keeps them.
# Before the rename the tree has thousands of hits: read the guard through `--dry-run`, which applies the rules first.

[[guard]]
id = "old-path"
target = "path"
pattern = '(^|/)orm(?:[-_.]|$)'

[[guard]]
id = "hyphen-prefix"
pattern = '(?<![A-Za-z0-9_@.-])orm-'

[[guard]]
id = "underscore-prefix"
pattern = '(?<![A-Za-z0-9_@.-])orm_'

[[guard]]
id = "old-npm-scope"
pattern = '@orm\b'

[[guard]]
id = "env-prefix"
pattern = '(?<![A-Za-z0-9_])ORM_'

[[guard]]
id = "node-addon"
pattern = '(?<![A-Za-z0-9_-])orm\.node'

[[guard]]
id = "config-table"
pattern = 'tool\.orm\b|\.orm\b'

[[guard]]
id = "dotted-name"
pattern = '(?<![A-Za-z0-9_@/.-])orm\.[A-Za-z]'

[[guard]]
id = "dash-m"
pattern = '-m orm\b'

[[guard]]
id = "quoted-name"
pattern = '''["']orm["']'''

[[guard]]
id = "command-text"
pattern = '(?<![A-Za-z0-9_@/.-])orm (?:generate|migrate|makemigrations|make|pull|check|identities|compile|rollback|sqlmigrate|baseline|drift|fmt)\b'

[[guard]]
id = "bare-lowercase-in-code"
files = ["**"]
exclude = ["**/*.md"]
pattern = '(?<![A-Za-z0-9_@/.-])orm(?![A-Za-z0-9_-])'

# --- kept environment variables and database names ----------------------------

[[allow]]
glob = "**"
pattern = 'ORM_(?:TEST_DATABASE_URL|RUST_TEST_POSTGRES_URL|BENCH_[A-Z_]+|FEATURE_CHECK_DIR)\b'
reason = "Test and bench variables stay; the owner may rename them later (Q3 in rename-spec.md)."

[[allow]]
glob = "**"
pattern = 'ORM_(?:CORE_COMPOSITION|ENGINE_COMPOSITION|PYTHON_METHODS|NODE_METHODS)\b'
reason = "Build-time variables read by the extension build scripts; no user sets them."

[[allow]]
glob = "**"
pattern = 'ORM_(?:PACKAGE_PYTHON|SOURCE|EXTENSION_[A-Z_]+)\b'
reason = "Variables of the extension build and test scripts; they are not part of the public surface."

[[allow]]
glob = "**"
pattern = '\borm_(?:test|test_rs|bench|benchmark)\b'
reason = "Local database names of the test and bench setup."

# --- names in code that stay ---------------------------------------------------

[[allow]]
glob = "crates/core/src/migrate/**"
pattern = '\$orm(?:\{i\})?\$'
reason = "Dollar-quote tag of generated SQL; any unused tag works, so the old text is harmless."

[[allow]]
glob = "languages/js/package.json"
pattern = '^\s*"orm",$'
reason = "npm search keyword: the generic term for the kind of library."

[[allow]]
glob = "bench/compare/**"
pattern = 'sqlalchemy\.orm\b'
reason = "The SQLAlchemy module `sqlalchemy.orm`."

# --- bench contender keys ------------------------------------------------------

[[allow]]
glob = "bench/compare/**"
pattern = '''["'`]orm(?:-all)?["'`]|\borm-all\b|\bORM_BUILDS\b|startswith\("orm"\)|(?:contenders|run|runner) orm\b|`orm`(?: and| runner)'''
reason = "The contender keys `orm` and `orm-all` name the recorded results; renaming them breaks the report on old data."

# --- text that names the old project on purpose ---------------------------------

[[allow]]
glob = "docs/**"
pattern = '`\.orm`|\.orm syntax|\.orm` file'
reason = "The old `.orm` schema file syntax, named as history in the Prisma-syntax notes."
