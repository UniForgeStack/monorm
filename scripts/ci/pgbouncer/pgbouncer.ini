; PgBouncer for the `pgbouncer` job of .github/workflows/checks.yml: transaction pooling, no server-side prepared statements.
; default_pool_size = 2 and server_round_robin = 1 make a client change servers between transactions.
[databases]
orm_test_rs = host=127.0.0.1 port=5432 dbname=orm_test_rs user=postgres password=postgres

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir =
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 0
default_pool_size = 2
server_round_robin = 1
max_client_conn = 100
