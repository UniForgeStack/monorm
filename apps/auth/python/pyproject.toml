[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monorm-auth"
version = "0.1.0"
description = "Users, roles, permissions and passwords for the ORM"
requires-python = ">=3.11"
dependencies = ["monorm", "argon2-cffi>=23.1"]

[project.entry-points."monorm.apps"]
monorm-auth = "monorm_auth:schema.prisma"

[tool.setuptools.packages.find]
include = ["monorm_auth*"]

[tool.setuptools.package-data]
monorm_auth = ["schema.prisma", "py.typed"]
