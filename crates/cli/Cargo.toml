[package]
name = "monorm-cli"
version = "0.1.1"
edition = "2021"
publish = false
description = "The `monorm` command line: one implementation, run as the `monorm` binary, `python -m monorm` and `npx monorm`."

[lib]
name = "monorm_cli"

[[bin]]
name = "monorm"
path = "src/main.rs"

[dependencies]
monorm-core = { path = "../core", default-features = false }
monorm-engine = { path = "../engine", default-features = false }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
dialoguer = { version = "0.12.0", default-features = false }

[features]
default = ["postgres", "sqlite", "generate-python", "generate-typescript", "generate-rust", "reference-loading"]
postgres = ["monorm-engine/postgres"]
sqlite = ["monorm-engine/sqlite"]
generate-rust = ["monorm-core/generate-rust"]
generate-python = ["monorm-core/generate-python"]
generate-typescript = ["monorm-core/generate-typescript"]
reference-loading = ["monorm-core/reference-loading"]
