[package]
name = "example-language"
version = "1.0.0"
edition = "2021"

[workspace]

[dependencies]
orm-contracts = { path = "../../../../contracts" }

[package.metadata.orm-extension]
id = "example.language"
version = "1.0.0"
host_contract = 1
schema_contract = 4
language_contract = 1
languages = ["python", "typescript"]
databases = ["postgres", "sqlite"]

[[package.metadata.orm-extension.attributes]]
name = "example.tagged"
target = "model"

[package.metadata.orm-extension.python]
source = "python/example_language"
query_set = "TaggedQuerySet"
instance = "TaggedInstance"

[package.metadata.orm-extension.typescript]
source = "typescript/src"
query_set = "taggedQuerySet"
bound_query_set = "taggedBoundQuerySet"
instance = "TaggedInstance"
