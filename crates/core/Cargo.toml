[package]
name = "monorm-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Language-independent ORM core: schema language, IR, extensions, migrations, code generation. No binding code."

[lib]
name = "monorm_core"

[dependencies]
monorm = { path = "../contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libloading = "0.9"
sha2 = "0.10"
chrono = "0.4"
uuid = "1"
bigdecimal = "0.4"

[features]
default = ["generate-python", "generate-typescript"]
generate-rust = []
generate-python = []
generate-typescript = []
reference-loading = []
# `HookRef::in_process`: a hook of the test binary, for tests of the planner and the executor.
testing = []

[dev-dependencies]
monorm-core = { path = ".", features = ["testing"] }
