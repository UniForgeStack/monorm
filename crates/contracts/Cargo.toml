[package]
name = "monorm-contracts"
version = "0.1.0"
edition = "2021"
description = "Contracts between the orm host and its extensions: manifests, hooks, schema IR and the native ABI."
license = "MIT"
repository = "https://github.com/UniForgeStack/monorm"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

[dev-dependencies]
toml = "0.8"
